# Runs in the standards repo. Weekly, checks out each target repo, runs `nrstd sync --write`
# and opens a PR with any drift corrections. Fill in the repo list.
#
# secrets.ROLLOUT must be a PAT (or GitHub App token), not the built-in GITHUB_TOKEN: it has to
# read and push to *other* repositories, and a PR opened with GITHUB_TOKEN would not trigger the
# target repo's own CI, which is the whole point of the sync PR. Because `nrstd sync` writes
# .github/workflows/*.yml, the token additionally needs the `workflow` scope (classic) or
# Workflows: read and write (fine-grained) -- without it the push is rejected at the very end
# with "refusing to allow a Personal Access Token to create or update workflow".
name: Roll out standard
on:
    workflow_dispatch:
    schedule:
        - cron: '0 6 * * 1'
jobs:
    rollout:
        runs-on: ubuntu-latest
        strategy:
            # One unreachable or misconfigured target must not cancel the other five.
            fail-fast: false
            matrix:
                repo:
                    - windkh/node-red-contrib-telegrambot
                    - windkh/node-red-contrib-shelly
                    - windkh/node-red-contrib-grohe-sense
                    - windkh/node-red-contrib-ntrip
                    - windkh/node-red-contrib-vallox
                    - windkh/node-red-node-telegrambot
        steps:
            - name: Checkout standards
              uses: actions/checkout@v7
              with: { path: standards }
            - name: Checkout target
              uses: actions/checkout@v7
              with:
                  repository: ${{ matrix.repo }}
                  path: target
                  token: ${{ secrets.ROLLOUT }}
            - uses: actions/setup-node@v7
              with: { node-version: 20.x }
            - name: Apply standard
              run: node standards/bin/nrstd.mjs sync target --write
            - name: Open PR
              uses: peter-evans/create-pull-request@v8
              with:
                  path: target
                  token: ${{ secrets.ROLLOUT }}
                  branch: chore/standards-sync
                  title: 'chore: sync repo to shared standard'
                  commit-message: 'chore: sync repo to shared standard'
